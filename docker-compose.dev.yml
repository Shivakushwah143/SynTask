services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: >
      sh -c "python scripts/wait_for_dependencies.py &&
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - syntask

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      BACKEND_HEALTH_URL: http://backend:8000/health
    command: >
      sh -c "python scripts/wait_for_dependencies.py &&
      celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/check_celery_health.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - syntask

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: https://synzent.ai/api/v1
        VITE_LOGIN_URL: https://synzent.ai/login
    environment:
      VITE_ALLOWED_HOSTS: all
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      VITE_API_URL: https://synzent.ai/api/v1
      VITE_LOGIN_URL: https://synzent.ai/login
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - syntask

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - syntask

volumes:
  backend_uploads:
  frontend_node_modules:
  redis_data:

networks:
  syntask:
