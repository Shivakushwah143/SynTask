services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URL: mongodb://mongo:27017/alphanexis_task_management
      REDIS_URL: redis://redis:6379/0
    command: sh -c "python scripts/wait_for_dependencies.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - syntask

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URL: mongodb://mongo:27017/alphanexis_task_management
      REDIS_URL: redis://redis:6379/0
      BACKEND_HEALTH_URL: http://backend:8000/health
    command: sh -c "python scripts/wait_for_dependencies.py && celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}"
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/check_celery_health.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - syntask

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://task.synzent.ai/api/v1}
        VITE_LOGIN_URL: ${VITE_LOGIN_URL:-https://task.synzent.ai/login}
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - syntask

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - syntask

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - syntask

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - syntask

volumes:
  backend_uploads:
  mongo_data:
  redis_data:

networks:
  syntask:
