services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: >
      sh -c "python scripts/wait_for_dependencies.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - syntask

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      BACKEND_HEALTH_URL: http://backend:8000/health
    command: >
      sh -c "python scripts/wait_for_dependencies.py &&
      celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}"
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # test: ["CMD", "python", "scripts/check_celery_health.py"]
      test: ["CMD-SHELL", "cd /app && PYTHONPATH=/app python scripts/check_celery_health.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - syntask

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_LOGIN_URL: ${VITE_LOGIN_URL:-/login}
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - syntask

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - syntask

  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - syntask

  prometheus:
    image: prom/prometheus:v2.53.3
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - syntask

volumes:
  backend_uploads:
  redis_data:
  qdrant_data:
  prometheus_data:

networks:
  syntask:
