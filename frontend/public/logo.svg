<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="720"
     height="769"
     viewBox="0 0 720 769"
     fill="none"
     role="img"
     aria-labelledby="title description">
  <title id="title">SynTask circuit S logo</title>
  <desc id="description">An angular orange letter S built from circuit-like paths with four circular terminals.</desc>

  <defs>
    <linearGradient id="brand-orange" x1="109" y1="656" x2="622" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B94A15"/>
      <stop offset="0.48" stop-color="#E56A1F"/>
      <stop offset="1" stop-color="#F8A26D"/>
    </linearGradient>
    <radialGradient id="terminal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(0 -5) rotate(90) scale(36)">
      <stop offset="0" stop-color="#F8A26D"/>
      <stop offset="0.72" stop-color="#E56A1F"/>
      <stop offset="1" stop-color="#B94A15"/>
    </radialGradient>
  </defs>

  <!-- Main angular S trace -->
  <path d="M615 280 L363 139 L255 204 L254 327 L477 463 L476 580 L362 654 L115 510"
        stroke="url(#brand-orange)"
        stroke-width="43"
        stroke-linecap="butt"
        stroke-linejoin="round"/>

  <!-- Upper-left branch -->
  <path d="M141 251 L141 404 L365 533"
        stroke="url(#brand-orange)"
        stroke-width="43"
        stroke-linecap="butt"
        stroke-linejoin="round"/>

  <!-- Lower-right branch -->
  <path d="M347 259 L580 390 L580 536"
        stroke="url(#brand-orange)"
        stroke-width="43"
        stroke-linecap="butt"
        stroke-linejoin="round"/>

  <!-- Circuit terminals -->
  <g fill="url(#terminal)">
    <circle cx="615" cy="280" r="29"/>
    <circle cx="141" cy="251" r="29"/>
    <circle cx="580" cy="536" r="29"/>
    <circle cx="115" cy="510" r="29"/>
  </g>

  <!-- Subtle inset detail visible in the reference terminals -->
  <g fill="#411807" opacity="0.18">
    <circle cx="615" cy="280" r="14"/>
    <circle cx="141" cy="251" r="14"/>
    <circle cx="580" cy="536" r="14"/>
    <circle cx="115" cy="510" r="14"/>
  </g>
</svg>
