# Prometheus scrape configuration for SynTask observability stack.
# Scrape targets use Docker internal networking (service name as hostname).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # SynTask backend application metrics
  - job_name: "syntask-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "syntask-backend"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
